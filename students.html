<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Student Materials &mdash; Healthy Skepticism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1F3A5F; --teal:#2E7D7B; --terra:#C0623B; --amber:#D9A441;
    --peach:#F2D8C2; --darkred:#8C2F2F; --paper:#FBF8F3; --ink:#22303F;
    --rule:#D8D2C6;
    --display:'Fraunces', Georgia, serif;
    --body:'Source Serif 4', Georgia, serif;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:var(--body); background:var(--paper); color:var(--ink);
       line-height:1.6; -webkit-font-smoothing:antialiased;}
  .wrap{max-width:760px; margin:0 auto; padding:48px 24px 72px;}
  .back{font-size:.88rem; color:var(--teal); text-decoration:none;}
  .back:hover{text-decoration:underline;}
  h1{font-family:var(--display); font-size:2.1rem; font-weight:700; color:var(--navy);
     margin:22px 0 8px; line-height:1.15;}
  .lede{font-size:1rem; max-width:44em; margin-bottom:30px;}
  .panel{background:var(--navy); color:var(--peach); padding:30px; border-radius:2px;}
  .panel h2{font-family:var(--display); color:var(--peach); font-size:1.25rem; margin-bottom:6px;}
  .panel p{font-size:.95rem; max-width:40em;}
  form{margin-top:18px; display:flex; gap:12px; flex-wrap:wrap; align-items:center;}
  input[type=password]{
    font-family:var(--body); font-size:1rem; padding:11px 14px; border:none;
    border-radius:2px; min-width:240px; flex:1 1 240px; color:var(--ink);
  }
  button{
    background:var(--amber); color:var(--navy); border:none; font-family:var(--body);
    font-weight:600; font-size:1rem; padding:12px 26px; cursor:pointer; border-radius:2px;
  }
  button:hover{background:var(--peach);}
  .msg{margin-top:14px; font-size:.9rem; min-height:1.2em;}
  .msg.bad{color:#FFC9B0;}
  #materials{display:none; margin-top:6px;}
  .deck-list{list-style:none; margin:0; padding:0;}
  .deck-list li{
    padding:13px 0; border-bottom:1px solid var(--rule);
    display:flex; justify-content:space-between; align-items:baseline; gap:14px;
  }
  .deck-list li:last-child{border-bottom:none;}
  .deck-list a{color:var(--teal); font-weight:600; text-decoration:none; font-size:1.02rem;}
  .deck-list a:hover{text-decoration:underline;}
  .deck-list span{font-size:.82rem; color:#8A8474; white-space:nowrap;}
  .note{margin-top:18px; font-size:.87rem; font-style:italic; color:#6B6559; max-width:44em;}
  footer{margin-top:44px; padding-top:18px; border-top:1px solid var(--rule);
         font-size:.82rem; color:#6B6559;}
  footer a{color:var(--navy);}
  @media (max-width:520px){ h1{font-size:1.7rem;} .panel{padding:22px;} }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="index.html">&larr; Healthy Skepticism</a>
  <h1>Student Materials</h1>
  <p class="lede">Slide decks and course materials for students enrolled in the course.
    Enter the password given out in class.</p>

  <div class="panel" id="gate">
    <h2>Password</h2>
    <form id="form">
      <input type="password" id="pw" autocomplete="current-password"
             placeholder="Password from class" aria-label="Password">
      <button type="submit">Unlock</button>
    </form>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </div>

  <div id="materials"></div>

  <footer>
    Trouble getting in? Email <a href="mailto:murraycantor+course@gmail.com">murraycantor+course@gmail.com</a>.
    Materials are for enrolled students. Please do not repost them.
  </footer>
</div>

<script>
const SALT = "75A1+45faPiNDpAb2jS+jg==", IV = "CciO2ZkJm+FeCT22", DATA = "Rj0R5j61GV08WPehGwYyYy+Yw3m9vK65HUXppO0PbfKP3xRXTjHT6VlsLEl9wCecPBZ3K7P83ZzvySN1MQdybe9Mf6bIxC5PeQkYvrxi7ODeCu52LWlvER0IkX0Gel59MlDfHRgvVuXwNZEYN2qSYUWHBkcnSIbSn5qSCkmc8z1Zee9TEuq8dYzJXe3aBMdMvycrQTbgr+xGKBMoQXUNLXuLI+7Xru+Ff22qoPKOxJKSBkd2JdGPG2dV9TbACU+tIdbOlnwfmwpl9EvlysCFp5o7VaZW/ZA/t2yigQ9798ATdpguOC2TBhUrwOn5D0CvIvq0g61BhYkzst2fraMxLGBULKf9WMIW9h9XqB7hqZcgTuldP8Q4bVA9pnmn3sUW2WkOJRntmm3y+4zyOcZ6Jjwy4NCL3tjImp9e3Mxxh2LHhQuApyCr9by8MJ80r8KyFyXTrxycPqFxHsMgOanuEfRMU2nKYL9s+QNtxlFFwa2qKu5xwNapn++XWn/mqpXv4z2GByLuQXBsYjmPRuq7BoRqdPTF0JrwfEzV2tDwCn988wJ7u1BVNmkVwpfkHqdQN2Am7L7noj19Ocuo8pFQRJK7XrMQ0HGXSgAsGFirAmlU8dXYMLKPOccbDRidf7sKNceYmAdnqGb1Sh0h/TN4rEEQUt9z8NuM3VEZV7qXmDfReZr2AcfC3ppwNpqBo20mbZM41vrHFpXi2oIqP3rL8L7ysn10GKQ+wM7ojF806XDt5ggy5feMWWFW4O38EJCSU7Bd3wR1VJFppywefvtXJc3iENAVAfPc7EWBU/CbU/a2VOpJRqk7feO7jq0iebNWEHSrt2mzFw==", ITER = 250000;
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));

async function unlock(password){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(DATA));
  return new TextDecoder().decode(plain);
}

const form = document.getElementById("form");
const msg  = document.getElementById("msg");

form.addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value;
  if(!pw) return;
  msg.className = "msg"; msg.textContent = "Checking\u2026";
  try{
    const html = await unlock(pw);
    document.getElementById("gate").style.display = "none";
    const box = document.getElementById("materials");
    box.innerHTML = html;
    box.style.display = "block";
  }catch(err){
    msg.className = "msg bad";
    msg.textContent = "That password did not work. Check for stray spaces, and note it is case sensitive.";
  }
});
</script>
</body>
</html>
